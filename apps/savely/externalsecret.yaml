apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: savely-secret
  namespace: savely
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: savely-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: savely
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        metadataPolicy: None

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-secrets
  namespace: seaweedfs
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: seaweedfs-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: seaweedfs
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        metadataPolicy: None

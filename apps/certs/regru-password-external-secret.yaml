apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regru-password
  namespace: cert-manager
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: regru-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: regru
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        metadataPolicy: None

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watchly-3d-models-secret
  namespace: watchly-3d-models-secret
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: watchly-3d-models-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: watchly-3d-models
        conversionStrategy: Default	
        decodingStrategy: None
        nullBytePolicy: Ignore
        metadataPolicy: None

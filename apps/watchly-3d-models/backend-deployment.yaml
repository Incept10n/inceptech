apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: watchly-3d-models
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: watchly-3d-models
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: incept1on/watchly-3d-models:back  # Replace with your backend image
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: WH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: watchly-3d-models-secret
              key: WH_DATABASE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
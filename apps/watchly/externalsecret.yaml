apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watchly-api-secret
  namespace: watchly
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: watchly-api-secret
    creationPolicy: Owner
  data:
    - secretKey: SMTP_API_KEY
      remoteRef:
        key: watchly-api
        property: api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchly-api
  namespace: watchly
  labels:
    app: watchly-api
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchly-api
  template:
    metadata:
      labels:
        app: watchly-api
        version: v1
    spec:
      containers:
      - name: watchly-api
        image: incept1on/watchly-api:master
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SMTP_API_KEY
          valueFrom:
            secretKeyRef:
              name: watchly-api-secret
              key: SMTP_API_KEY
        - name: FROM_EMAIL
          value: "noreply@watchly.inceptech.ru"
        - name: TO_EMAIL
          value: "Incept1on.hf@yandex.ru"
        resources:
          requests:
            memory: "128Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "10m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: watchly-api
  namespace: watchly
  labels:
    app: watchly-api
spec:
  selector:
    app: watchly-api
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
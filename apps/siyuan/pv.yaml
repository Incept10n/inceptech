apiVersion: v1
kind: PersistentVolume
metadata:
  name: siyuan-local-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/siyuan-data  # Your data path
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname  # GA label, not beta
          operator: In
          values:
          - cl148rcr9mfmndd5t7fp-ocaq # Your node name

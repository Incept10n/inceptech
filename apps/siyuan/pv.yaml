apiVersion: v1
kind: PersistentVolume
metadata:
  name: siyuan-local-pv
  namespace: siyuan 
  labels:
    app: siyuan
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:  
    path: /mnt/siyuan-data

# API coffeely (Go). Образ собирает CI репозитория coffeely:
#   incept1on/coffeely-backend:backend  (push в main)
# Тег мутабельный, imagePullPolicy: Always — новый образ подхватывается
# рестартом пода (ArgoCD сам не рестартует: `kubectl rollout restart`).
#
# Миграции — initContainer тем же образом (/app/migrate up, идемпотентно,
# с ожиданием готовности БД). Схема накатывается до старта приложения.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: coffeely
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: coffeely
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Exchange живёт во внутренней сети (192.168.50.10), а DNS кластера его
      # не знает: фиксируем маршрут для отправки писем с кодом подтверждения.
      hostAliases:
        - ip: "192.168.50.10"
          hostnames:
            - "mail.inceptech.ru"
      initContainers:
        - name: migrate
          image: incept1on/coffeely-backend:backend
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - "until /app/migrate up; do echo 'waiting for postgres'; sleep 3; done"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      containers:
        - name: backend
          image: incept1on/coffeely-backend:backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENV
              value: prod
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: JWT_SECRET
            # Строка входа во внутреннюю админку создателей (/admin).
            - name: ADMIN_CRM_SECRET
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: ADMIN_CRM_SECRET
            # Публичный адрес для OAuth Yandex ID (web-флоу; приложение входит
            # по токену LoginSDK через POST /auth/yandex/token).
            # API живёт под /api на том же домене, что лендинг.
            - name: YANDEX_REDIRECT_URL
              value: https://coffeely.inceptech.ru/api/auth/yandex/callback
            # Вход через Яндекс ID в приложении. Без YANDEX_CLIENT_ID фича
            # выключена: /auth/providers отдаёт false, кнопки в APK нет.
            - name: YANDEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: YANDEX_CLIENT_ID
            # Секрет нужен серверному web-флоу и проверке JWT; для
            # POST /auth/yandex/token достаточно ClientID.
            - name: YANDEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: YANDEX_CLIENT_SECRET
            # Подтверждение email: пароль ящика Exchange (NTLM).
            # Остальное — дефолты конфига (coffeely@inceptech.ru, EWS на
            # mail.inceptech.ru), вынесены сюда явно для смены отправителя.
            - name: MAIL_EWS_URL
              value: https://mail.inceptech.ru/EWS/Exchange.asmx
            - name: MAIL_USERNAME
              value: coffeely@inceptech.ru
            - name: MAIL_FROM
              value: coffeely@inceptech.ru
            - name: MAIL_FROM_NAME
              value: coffeely
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coffeely-secrets
                  key: MAIL_PASSWORD
          resources:
            requests:
              memory: "32Mi"
              cpu: "15m"
            limits:
              memory: "192Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3

# Секреты coffeely в OpenBao: secret/coffeely
#   bao kv put secret/coffeely password="<пароль postgres>" jwt_secret="<32+ символов>" \
#     admin_crm_secret="<строка входа в /admin>" mail_password="<пароль coffeely@inceptech.ru>" \
#     yandex_client_id="<ClientID Яндекс OAuth>" yandex_client_secret="<Client secret>"
# Добавлять ключи только через `bao kv patch`, не `kv put`: put перезаписывает запись.
# Из них собирается DATABASE_URL — приложению нужна одна переменная.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coffeely-secrets
  namespace: coffeely
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: coffeely-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        ADMIN_CRM_SECRET: "{{ .admin_crm_secret }}"
        MAIL_PASSWORD: "{{ .mail_password }}"
        YANDEX_CLIENT_ID: "{{ .yandex_client_id }}"
        YANDEX_CLIENT_SECRET: "{{ .yandex_client_secret }}"
        DATABASE_URL: "postgres://coffeely:{{ .password }}@postgres:5432/coffeely?sslmode=disable"
  dataFrom:
    - extract:
        key: coffeely
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        metadataPolicy: None

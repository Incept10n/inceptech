apiVersion: apps/v1
kind: Deployment
metadata:
  name: regru-webhook
  labels:
    app: regru-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regru-webhook
  template:
    metadata:
      labels:
        app: regru-webhook
    spec:
      serviceAccountName: regru-webhook
      containers:
        - name: regru-webhook
          image: ghcr.io/flant/cert-manager-webhook-regru:1.3.2
          args:
            - --secure-port=8443
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: acme.regru.ru
            # Credentials come from the ExternalSecret `regru-password`
            # (OpenBao KV `secret/regru`) — nothing sensitive is stored here.
            - name: REGRU_USERNAME
              valueFrom:
                secretKeyRef:
                  name: regru-password
                  key: REGRU_USERNAME
            - name: REGRU_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: regru-password
                  key: REGRU_PASSWORD
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: regru-webhook-serving-cert

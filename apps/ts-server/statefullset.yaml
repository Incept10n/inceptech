apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ts3
  namespace: ts-server
spec:
  serviceName: ts3-service
  replicas: 1
  selector:
    matchLabels:
      app: ts3
  template:
    metadata:
      labels:
        app: ts3
    spec:
      containers:
      - name: teamspeak
        image: teamspeak:3.13.8
        imagePullPolicy: Always
        env:
        - name: TS3SERVER_LICENSE
          value: "accept"
        ports:
        - containerPort: 9987
          name: voice
          protocol: UDP
          hostPort: 9987
        - containerPort: 10011
          name: query
          protocol: TCP
          hostPort: 10011
        - containerPort: 30033
          name: filetransfer
          protocol: TCP
          hostPort: 30033
        volumeMounts:
        - name: ts3-data
          mountPath: /var/run/ts3server
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
  volumeClaimTemplates:
    - metadata:
        creationTimestamp: null
        name: ts3-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
      apiVersion: v1
      kind: PersistentVolumeClaim
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs-config
  namespace: argocd
  annotations:
    # Applied before the `seaweedfs` Helm release (wave 0) so the
    # ExternalSecret / Secret exist before the pods start.
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Incept10n/inceptech.git
    targetRevision: master
    path: apps/seaweedfs
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClusterSecretStore/ExternalSecret CRDs; also keeps ESO objects out of
      # the 256KB last-applied-configuration limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# Статический фронтенд свадебного сайта (Vite build -> nginx).
# Исходники: github.com/Incept10n/wedding, CI собирает образ incept1on/wedding:front.
#
# Тег мутабельный (`:front`), поэтому новый образ подхватывается только после
# рестарта пода: `kubectl rollout restart deployment frontend -n wedding`
# (CI репозитория wedding в кластер не ходит — только build+push).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wedding
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wedding
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: incept1on/wedding:front
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "100Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/seaweedfs/seaweedfs.git
    targetRevision: helm-4.49.0
    path: k8s/charts/seaweedfs
    helm:
      releaseName: seaweedfs
      values: |
        global:
          seaweedfs:
            createClusterRole: true
            serviceAccountName: seaweedfs
            image:
              name: chrislusf/seaweedfs
            imagePullPolicy: IfNotPresent

        master:
          enabled: true
          replicas: 1
          port: 9333
          grpcPort: 19333
          metricsPort: 9327
          data:
            type: persistentVolumeClaim
            size: 10Gi
            storageClass: local-path
          logs:
            type: persistentVolumeClaim
            size: 2Gi
            storageClass: local-path
          ingress:
            enabled: false
          httpRoute:
            enabled: false

        volume:
          enabled: true
          replicas: 1
          port: 8080
          grpcPort: 18080
          metricsPort: 9327
          dataDirs:
            - name: data1
              type: persistentVolumeClaim
              size: 200Gi
              storageClass: local-path
              maxVolumes: 0
          logs:
            type: persistentVolumeClaim
            size: 2Gi
            storageClass: local-path
          ingress:
            enabled: false
          httpRoute:
            enabled: false

        filer:
          enabled: true
          replicas: 1
          port: 8888
          grpcPort: 18888
          metricsPort: 9327
          data:
            type: persistentVolumeClaim
            size: 10Gi
            storageClass: local-path
          logs:
            type: persistentVolumeClaim
            size: 2Gi
            storageClass: local-path
          s3:
            enabled: true
          ingresses:
            http:
              enabled: false
            grpc:
              enabled: false
          httpRoute:
            enabled: false

        s3:
          enabled: true
          replicas: 1
          bindAddress: 0.0.0.0
          port: 8333
          enableAuth: true
          credentials:
            admin:
              existingSecret: "seaweedfs-secrets"
              accessKeyKey: "s3-access-key"
              secretKeyKey: "s3-secret-key"
          existingConfigSecret: null
          ingress:
            enabled: false
          httpRoute:
            enabled: false
          logs:
            type: persistentVolumeClaim
            size: 2Gi
            storageClass: local-path
          service:
            type: ClusterIP

        admin:
          enabled: true
          replicas: 1
          port: 12535
          grpcPort: 22535
          ip: "0.0.0.0"
          allowInsecureBind: false
          secret:
            existingSecret: "seaweedfs-secrets"
            userKey: "admin-user"
            pwKey: "admin-password"
          data:
            type: persistentVolumeClaim
            size: 5Gi
            storageClass: local-path
          logs:
            type: persistentVolumeClaim
            size: 2Gi
            storageClass: local-path
          ingress:
            enabled: false
          httpRoute:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
